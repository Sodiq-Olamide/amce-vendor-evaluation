services:
  # Web Application Service
  - type: web
    name: amce-vems
    env: python
    region: frankfurt # or oregon
    plan: free # or starter
    rootDir: amce_vems
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: amce-vems-postgres
          property: connectionString
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.office365.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "AMCE Evaluation Committee <notifications@amce.ng>"
      - key: SITE_DOMAIN
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: amce-vems-postgres
    region: frankfurt # or oregon
    plan: free # or starter
    databaseName: amce_vems_db
    user: amce_user
